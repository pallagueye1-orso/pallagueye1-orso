name: Mise à jour du README

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6 h UTC
  workflow_dispatch:       # lancement manuel possible
  push:
    branches: [main]
    paths: ["scripts/update_readme.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Régénérer la liste des dépôts
        run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enregistrer les changements
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Mise à jour automatique des dépôts"
            git push
          fi
